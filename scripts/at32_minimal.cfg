# AT32F403A — MINIMAL OpenOCD attach. Does not source target/stm32f1x.cfg.
#
# Why this exists (2026-08-11): the long-standing ~/at32_attach.cfg sources
# target/stm32f1x.cfg, i.e. it drives an Artery AT32F403A with ST's STM32F1
# target script. Measured on the bench: the device runs indefinitely on its own,
# survives the ST-Link merely being plugged in, and then FREEZES on a bare
# `openocd -c init -c targets -c shutdown`. Attaching is what kills it.
#
# Two things in stm32f1x.cfg are candidates, both of which assume hardware this
# part is not:
#
#   1. an examine-end event doing `mmw 0xE0042004 0x00000307 0` — a
#      read-modify-write of STM32F1's DBGMCU_CR on every attach
#   2. `flash bank ... stm32f1x 0x08000000 ...`, whose probe reads flash that is
#      read-protected here (reads return 0xFF)
#
# This config defines the target and nothing else: no flash bank, no DBGMCU
# poke, no reset wiring. If attaching with this leaves the device running, the
# perturbation is in stm32f1x.cfg and can be bisected from there.
#
# Everything that matters for this project's SWD work — peripheral reads, and
# driving SPI3 from the host with the CPU halted — needs only a target
# definition. None of it needs a flash driver.
#
# Usage:  openocd -f scripts/at32_minimal.cfg -c init -c targets -c shutdown

source [find interface/stlink.cfg]
transport select hla_swd

# swj-dp.tcl provides swj_newdap, which dispatches to `hla newtap` when the
# transport is hla. Same mechanism stm32f1x.cfg uses — this config differs only
# in what it OMITS (flash bank, DBGMCU examine-end poke, reset wiring).
source [find target/swj-dp.tcl]

adapter speed 1000

set _CHIPNAME at32f403a
set _CPUTAPID 0x2ba01477

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -endian little -dap $_CHIPNAME.dap

# No reset line is wired on this bench setup (SWDIO/SWCLK/GND only).
reset_config none separate
